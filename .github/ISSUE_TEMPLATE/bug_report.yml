name: 🐛 Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to…
        2. Tap…
        3. See…
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone
        - iPad
        - Mac
    validations:
      required: true

  - type: input
    id: device-os
    attributes:
      label: Device & OS version
      placeholder: e.g. iPhone 15 Pro, iOS 26.1
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: CuIRC build
      description: Shown in Testflight, e.g. 1.0 (4).
      placeholder: 1.0 (4)
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If it helps, drag in screenshots or a screen recording. (Optional)
    validations:
      required: false
